<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | ShopZone</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">

</head>

<body>


    <header class="auth-navbar">

        <a href="{{ url_for('home') }}"
           class="auth-logo">

            🛒 ShopZone

        </a>

    </header>


    <main class="auth-page">


        <div class="auth-card">


            <div class="auth-header">

                <span>
                    WELCOME BACK
                </span>

                <h1>
                    Login
                </h1>

                <p>
                    Sign in to your ShopZone account.
                </p>

            </div>


            {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

            {% endif %}


            <form method="POST"
                  action="{{ url_for('login') }}">


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button
                    type="submit"
                    class="auth-button">

                    Login

                </button>


            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                </p>

                <a href="{{ url_for('register') }}">
                    Create an account
                </a>

            </div>


            <a href="{{ url_for('home') }}"
               class="back-home">

                ← Back to Home

            </a>


        </div>


    </main>

</body>

</html>
